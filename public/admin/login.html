<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — 3rd I Visuals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f14;--bg2:#17171e;--bg3:#1f1f28;--bg4:#27272f;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --orange:#E8531D;--orange2:#ff6a35;
  --text:#f0f0f0;--text2:#9090a8;--text3:#5a5a70;
  --danger:#f06060;--font:'Inter',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px;width:400px;max-width:100%;margin:20px}
.logo{font-size:22px;font-weight:800;text-align:center;margin-bottom:28px}
.logo span{color:var(--orange)}
h2{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center}
.sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:28px}
label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color 0.2s;margin-bottom:16px}
input:focus{border-color:var(--orange)}
button{width:100%;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all 0.2s;margin-top:4px}
button:hover{background:var(--orange2)}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;display:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo"><span>3rd I</span> Visuals</div>
  <h2>Admin Login</h2>
  <div class="sub">Sign in to manage your bookings</div>
  <label>Username</label>
  <input type="text" id="u" placeholder="admin" autocomplete="username">
  <label>Password</label>
  <input type="password" id="p" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()" id="btn">Sign in →</button>
  <div class="err" id="err">Invalid username or password</div>
</div>
<script>
async function login() {
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  btn.disabled = true;

  const res  = await fetch('/admin/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
  });
  const data = await res.json();
  if (data.success) {
    window.location = '/admin';
  } else {
    err.style.display = 'block';
    btn.innerHTML = 'Sign in →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
